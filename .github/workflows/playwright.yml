name: Playwright CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  CI: true

jobs:
  validate:
    name: Typecheck and offline framework tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck without emitting JavaScript
        run: npx tsc
      - name: Build reporter and run offline tests
        run: npm run test:framework
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: framework-test-results
          path: test-results/api-framework/
          if-no-files-found: ignore
          retention-days: 7

  playwright:
    name: Playwright Tests (${{ matrix.name }})
    needs: validate
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API
            test-filter: 'api[\\/]tests[\\/](?!framework[\\/])'
            project: api
            browser: none
          - name: UI
            test-filter: 'ui[\\/]tests[\\/]saucedemo'
            project: saucedemo-chromium
            browser: chromium
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Set up Java for the Allure CLI
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm ci
      - name: Install required UI browser and system dependencies
        if: matrix.browser != 'none'
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Build reporter and run selected live suite
        run: npm test -- --config=playwright.config.ts --project=${{ matrix.project }} '${{ matrix.test-filter }}'
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-results-${{ matrix.name }}
          path: |
            allure-results/
            allure-report/
            test-results/
            ai/failure-summaries/raw/
            ai/failure-summaries/artifacts/
          if-no-files-found: warn
          retention-days: 30
