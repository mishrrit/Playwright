name: Playwright CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build_and_test:
    name: Build AI helpers and clear all artifacts prior run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js 18
        uses: actions/setup-node@v5
        with:
          node-version: 18
      - name: Install dependencies
        run: npm ci
      - name: Build AI helpers
        run: npm run build:ai
      - name: Run tests
        run: npm test
        env:
          CI: true

  playwright:
    name: Playwright Tests (matrix)
    needs: build_and_test
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: API
            path: api
            project: api
          - name: UI
            path: ui
            project: ui-testing-playground-chromium
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: |
          npx playwright test ${{ matrix.path }} --project=${{ matrix.project }} --reporter=line,allure-playwright
          # rename the default Playwright report folder to a matrix-specific folder
          if [ -d "playwright-report" ]; then mv playwright-report "playwright-report-${{ matrix.name }}"; fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.name }}
          path: playwright-report-${{ matrix.name }}/
          retention-days: 30
